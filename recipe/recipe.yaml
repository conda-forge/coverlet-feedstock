context:
  version: "10.1.0"

package:
  name: coverlet
  version: ${{ version }}

source:
  - git: https://github.com/coverlet-coverage/coverlet
    tag: v${{ version }}
  - url: https://github.com/coverlet-coverage/coverlet/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 16e0f8ca674211b0555f17996892fc88ea0f7d654caa70ac105c103fa2928b14
    target_directory: archive

build:
  number: 0
  noarch: generic

requirements:
  host:
    - dotnet =9
    - git
    - nuget-license <4
  run:
    - dotnet =9

tests:
  - script:
      - coverlet --help

about:
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: Cross platform code coverage for .NET
  homepage: https://github.com/coverlet-coverage/coverlet
  repository: https://github.com/coverlet-coverage/coverlet

extra:
  recipe-maintainers:
    - danielnachun
