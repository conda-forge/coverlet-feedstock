context:
  version: "10.1.1"

package:
  name: coverlet
  version: ${{ version }}

source:
  - git: https://github.com/coverlet-coverage/coverlet
    tag: v${{ version }}
  - url: https://github.com/coverlet-coverage/coverlet/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 6930f16e31a2167d00196a7f3a517907ea0f8bfd68a1999b8d39b503e5f7c7ca
    target_directory: archive

build:
  number: 0
  noarch: generic

requirements:
  host:
    - dotnet =9
    - git
    - nuget-license <4
  run:
    - dotnet =9

tests:
  - script:
      - coverlet --help

about:
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: Cross platform code coverage for .NET
  homepage: https://github.com/coverlet-coverage/coverlet
  repository: https://github.com/coverlet-coverage/coverlet

extra:
  recipe-maintainers:
    - danielnachun
